name: Deploy Big Two

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Assemble the playable files
        shell: bash
        run: |
          set -euo pipefail
          rm -f probe-*.txt
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm -f "$f"
          done < <(find . -path ./.git -prune -o -name '*.b64' -print0)
          if ls main.dart.js.part* >/dev/null 2>&1; then
            cat $(ls main.dart.js.part* | sort) > main.dart.js
            rm -f main.dart.js.part*
          fi
          if ls assets/NOTICES.part* >/dev/null 2>&1; then
            cat $(ls assets/NOTICES.part* | sort) > assets/NOTICES
            rm -f assets/NOTICES.part*
          fi
          test -s main.dart.js
          test -s favicon.png
          test -s assets/fonts/MaterialIcons-Regular.otf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble the playable site"
          git push origin HEAD:gh-pages

      - name: Request a Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds"
