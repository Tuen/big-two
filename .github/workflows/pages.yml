name: Publish the web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the TypeScript rules
        working-directory: rules
        run: node --experimental-strip-types --test --test-concurrency=1 test/rules.test.ts test/bots.test.ts test/recent.test.ts

      - name: Test the Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter test

      - name: Decode web icons
        working-directory: app
        run: |
          python3 - <<'PY'
          import base64, pathlib
          found = list(pathlib.Path("web").rglob("*.png.b64"))
          if not found:
              raise SystemExit("no web icons to decode")
          for src in found:
              dest = src.with_suffix("")
              dest.write_bytes(base64.b64decode(src.read_text().strip()))
              src.unlink()
              print(dest.as_posix(), dest.stat().st_size)
          PY

      - name: Build the web app
        working-directory: app
        run: flutter build web --release --base-href /big-two/ --dart-define-from-file=public-client.json

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Replace the site
        run: |
          # site/test belongs to the test preview. Do not delete it.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name test -exec rm -rf {} +
          cp -a app/build/web/. site/
          rm -rf site/canvaskit
          if [ -e app/build/web/test ]; then
            echo "The live build contains a test folder and would replace the preview."
            exit 1
          fi
          touch site/.nojekyll

      - name: Publish
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site is already current"
          else
            git commit -m "Publish the web app"
            git push origin HEAD:gh-pages
          fi
