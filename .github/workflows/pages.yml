name: Deploy Big Two

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rm -f probe-*.txt
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
          done < <(find . -path ./.git -prune -o -name '*.b64' -print0)
          if ls main.dart.js.part* >/dev/null 2>&1; then
            cat $(ls main.dart.js.part* | sort) > main.dart.js
            rm -f main.dart.js.part*
          fi
          if ls assets/NOTICES.part* >/dev/null 2>&1; then
            cat $(ls assets/NOTICES.part* | sort) > assets/NOTICES
            rm -f assets/NOTICES.part*
          fi
          tar -cf - \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude README.md \
            --exclude '*.b64' \
            . | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/main.dart.js
          test -f _site/favicon.png
          test -s _site/favicon.png

      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages" --input - <<'EOF'
          {"build_type":"workflow"}
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
