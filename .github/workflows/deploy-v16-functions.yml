name: Deploy v1.6 edge functions

# Updates the shared Supabase project so the test page can hand over a seat.
# It does not publish the live web page. That stays on the Pages workflow.
on:
  push:
    branches: [cursor/v1.6-seat-handover-d652]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Add the seat handover tables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. The database was not updated."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = open("supabase/migrations/008_stand_ins.sql", encoding="utf-8").read()
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
              print(response.read().decode()[:400])
          PY

      - name: Deploy table deal play pass tick ping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. Edge functions were not deployed."
            exit 1
          fi
          export SUPABASE_ACCESS_TOKEN
          supabase functions deploy table deal play pass tick ping \
            --project-ref ascorkeijzrpmfykpcrb \
            --use-api \
            --yes
