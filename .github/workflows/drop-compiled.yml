name: Drop compiled files from main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove the compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch assets icons
          git rm -f --ignore-unmatch .nojekyll favicon.png.b64 flutter.js flutter_bootstrap.js flutter_service_worker.js index.html manifest.json version.json
          git ls-files "main.dart.js.part*" | xargs -r git rm -f
          if git diff --cached --quiet; then
            echo "nothing to drop"
          else
            git commit -m "Remove the compiled web build from main"
            git push origin HEAD:main
          fi
