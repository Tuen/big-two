name: Deploy edge functions

on:
  workflow_dispatch:
  push:
    branches: [v1.1-dev]
    paths:
      - .github/workflows/deploy-functions.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.1-dev
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Read the deal of TVZU2X hand 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = """
          select json_build_object(
            'v14', (select settings->>'v14' from game_tables where code = 'TVZU2X'),
            'deck', (
              select s.deck from hand_secrets s
              join hands h on h.id = s.hand_id
              join game_tables t on t.id = h.table_id
              where t.code = 'TVZU2X' and h.hand_number = 10
              order by h.created_at desc limit 1
            )
          ) as report;
          """
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"], "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY

      - name: Add viewer and chat tables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. The database was not updated."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = open("supabase/migrations/005_viewers_and_chat.sql", encoding="utf-8").read()
          sql += "\n" + open("supabase/migrations/006_pause_and_move_log.sql", encoding="utf-8").read()
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
              print(response.read().decode()[:400])
          PY

      - name: Deploy table deal play pass tick ping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. Edge functions were not deployed."
            exit 1
          fi
          export SUPABASE_ACCESS_TOKEN
          supabase functions deploy table deal play pass tick ping \
            --project-ref ascorkeijzrpmfykpcrb \
            --use-api \
            --yes
