name: Deploy edge functions

on:
  workflow_dispatch:
  push:
    branches: [v1.1-dev]
    paths:
      - .github/workflows/deploy-functions.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.1-dev
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Read TVZU2X hand 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = """
          select json_build_object(
            'seats', (
              select coalesce(json_agg(json_build_object(
                'seat', s.seat_index, 'name', s.display_name, 'bot', s.is_bot
              ) order by s.seat_index), '[]'::json)
              from seats s
              join game_tables t on t.id = s.table_id
              where t.code = 'TVZU2X'
            ),
            'hands', (
              select coalesce(json_agg(json_build_object(
                'hand', h.hand_number,
                'status', h.status,
                'winner', h.winner_seat,
                'message', h.last_message,
                'at', h.created_at,
                'cards', r.cards_left,
                'players', r.players,
                'points', r.hand_points,
                'events', (
                  select coalesce(json_agg(json_build_object(
                    'seq', e.seq, 'seat', e.seat_index, 'kind', e.kind, 'cards', e.payload->'cards'
                  ) order by e.seq), '[]'::json)
                  from events e where e.hand_id = h.id
                )
              ) order by h.hand_number), '[]'::json)
              from hands h
              join game_tables t on t.id = h.table_id
              left join hand_results r on r.hand_id = h.id
              where t.code = 'TVZU2X' and h.hand_number between 9 and 10
            )
          ) as report;
          """
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode()[:20000])
          PY

      - name: Add viewer and chat tables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. The database was not updated."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = open("supabase/migrations/005_viewers_and_chat.sql", encoding="utf-8").read()
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
              print(response.read().decode()[:400])
          PY

      - name: Deploy table deal play pass tick ping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "This repository has no SUPABASE_ACCESS_TOKEN secret. Edge functions were not deployed."
            exit 1
          fi
          export SUPABASE_ACCESS_TOKEN
          supabase functions deploy table deal play pass tick ping \
            --project-ref ascorkeijzrpmfykpcrb \
            --use-api \
            --yes
