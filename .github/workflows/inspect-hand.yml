name: Inspect one hand

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read TVZU2X hand 10
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALT_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$ALT_TOKEN" ]; then
            SUPABASE_ACCESS_TOKEN="$ALT_TOKEN"
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          sql = """
          select json_build_object(
            'seats', (
              select coalesce(json_agg(json_build_object(
                'seat', s.seat_index, 'name', s.display_name, 'bot', s.is_bot
              ) order by s.seat_index), '[]'::json)
              from seats s
              join game_tables t on t.id = s.table_id
              where t.code = 'TVZU2X'
            ),
            'hands', (
              select coalesce(json_agg(json_build_object(
                'id', h.id,
                'hand', h.hand_number,
                'round', h.round_number,
                'status', h.status,
                'winner', h.winner_seat,
                'message', h.last_message,
                'at', h.created_at,
                'cards', r.cards_left,
                'players', r.players,
                'points', r.hand_points,
                'bots', r.bots,
                'events', (
                  select coalesce(json_agg(json_build_object(
                    'seq', e.seq, 'seat', e.seat_index, 'kind', e.kind, 'cards', e.payload->'cards'
                  ) order by e.seq), '[]'::json)
                  from events e where e.hand_id = h.id
                )
              ) order by h.hand_number), '[]'::json)
              from hands h
              join game_tables t on t.id = h.table_id
              left join hand_results r on r.hand_id = h.id
              where t.code = 'TVZU2X' and h.hand_number between 8 and 11
            )
          ) as report;
          """
          request = urllib.request.Request(
              "https://api.supabase.com/v1/projects/ascorkeijzrpmfykpcrb/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["SUPABASE_ACCESS_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              raw = response.read().decode()
          print(raw[:20000])
          PY
